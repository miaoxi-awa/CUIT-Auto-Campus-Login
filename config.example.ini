[account]
# 校园网账号（学号/工号）—— 首次运行会引导输入，也可以直接填在这里
# 真实凭据写在 config.ini（不会被 git 提交），此文件只是模板
username = 你的学号
password = 你的密码

[portal]
# 校园网认证页地址（已填好，新电脑无需再探测）
url = http://10.254.241.66/portal/entry/pc/authenticate;flowParams=undefined;from=
# 运营商/服务选项（电信 / 移动 / 联通）
service = 移动

[browser]
# true = 静默后台跑，false = 显示浏览器窗口
headless = false
